name: publish-npm

# Publishes the package to npm when a GitHub release is published. The
# release act is the maintainer's publication signal; the workflow only ever
# ships the allowlisted tree that the release tag points at.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) — no stored token needed

concurrency:
  group: publish-npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches package.json version
        run: |
          TAG='${{ github.event.release.tag_name }}'
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Publish to npm (trusted publishing)
        run: npm publish --access public --provenance

      - name: Verify published version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for i in 1 2 3 4 5 6; do
            if [ "$(npm view pi-tier-scheduler version --registry https://registry.npmjs.org/)" = "$VERSION" ]; then
              echo "published pi-tier-scheduler@$VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "npm view did not report $VERSION after retries"
          exit 1
