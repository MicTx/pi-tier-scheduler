name: publish-npm

# Publishes the package to npm when a GitHub release is published. The
# release act is the maintainer's publication signal; the workflow only ever
# ships the allowlisted tree that the release tag points at.
#
# workflow_dispatch exists for bootstrap and recovery: point it at a release
# tag to re-run publication without cutting a new release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.3.1)"
        required: true

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) — no stored token needed

concurrency:
  group: publish-npm-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # trusted publishing requires Node >= 22.14.0
          registry-url: https://registry.npmjs.org/

      - name: Use a trusted-publishing-capable npm (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          TAG='${{ github.event.release.tag_name || inputs.tag }}'
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Publish to npm (trusted publishing; stage fallback)
        run: |
          if npm publish --access public --provenance; then
            exit 0
          fi
          # A pending-validation trusted publisher rejects direct publishes;
          # staging goes through the same trust without 2FA and validates it.
          # A maintainer then approves the staged version on npmjs.com.
          echo "direct publish failed — staging instead"
          npm stage --provenance

      - name: Verify published version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for i in 1 2 3 4 5 6; do
            if [ "$(npm view pi-tier-scheduler version --registry https://registry.npmjs.org/)" = "$VERSION" ]; then
              echo "published pi-tier-scheduler@$VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "note: version not visible yet — staged versions publish after maintainer approval"
